name: Package released skill

on:
  push:
    tags:
      - "*-v*.*.*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve and validate skill
        id: meta
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          skill="${tag%-v*}"
          python skill-repository-manager/scripts/skillctl.py --repo-root . --json verify "$skill"
          echo "skill=$skill" >> "$GITHUB_OUTPUT"
      - name: Package
        shell: bash
        run: |
          skill="${{ steps.meta.outputs.skill }}"
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          zip -r "dist/${tag}.zip" "$skill"
          sha256sum "dist/${tag}.zip" > "dist/${tag}.sha256"
      - name: Ensure release exists and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --generate-notes --title "$tag"
          gh release upload "$tag" "dist/${tag}.zip" "dist/${tag}.sha256" --clobber

